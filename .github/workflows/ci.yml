# CI workflow for main and feature/2.0.x (JDK 17)
#
# Triggers:
#   - push / pull_request on main and feature/2.0.x
#   - manual workflow_dispatch
#
# Runs `mvn -B clean verify` including JaCoCo coverage reporting.
# The configured 90% coverage check is currently nonblocking (haltOnFailure=false).
name: CI

on:
  push:
    branches: [main, feature/2.0.x]
  pull_request:
    branches: [main, feature/2.0.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK 17 Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Chromium for render integration tests
        run: |
          mvn -B --no-transfer-progress -pl playwright-extension-render -am -DskipTests install
          mvn -B --no-transfer-progress -f playwright-extension-render/pom.xml org.codehaus.mojo:exec-maven-plugin:3.6.4:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args='install --with-deps chromium'

      - name: Build and verify with JaCoCo coverage report
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: '**/target/site/jacoco'
          retention-days: 14

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          retention-days: 14
